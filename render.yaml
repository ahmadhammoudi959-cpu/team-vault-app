# Render Blueprint: one free web service + one free Postgres that is closed to the internet.
# Secrets are generated by Render itself and never stored in this repository.
databases:
  - name: team-vault-db
    plan: free
    region: frankfurt
    databaseName: vault
    user: vault
    ipAllowList: [] # no internet connections at all; only services on Render's private network

services:
  - type: web
    name: team-vault-h2rf5
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: "off" # a push to GitHub never changes the live app until someone presses Deploy on Render
    envVars:
      - key: NODE_ENV
        value: production
      - key: MASTER_SECRET
        generateValue: true # random 256-bit key created by Render; keep it, never regenerate it
      - key: DATABASE_URL
        fromDatabase:
          name: team-vault-db
          property: connectionString # private-network URL
      - key: DB_PLAN
        value: free
      - key: APP_NAME
        value: "الخزنة"
      - key: TOTP_ISSUER
        value: "Team Vault"
