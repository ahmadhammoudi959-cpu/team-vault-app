# Render Blueprint: one free web service. The database lives on Neon (free, never expires).
# MASTER_SECRET is generated by Render itself; DATABASE_URL is pasted in Render by the owner.
# Neither is ever stored in this repository.
services:
  - type: web
    name: team-vault-h2rf5
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: "off" # a push to GitHub never changes the live app until someone presses Deploy on Render
    envVars:
      - key: NODE_ENV
        value: production
      - key: MASTER_SECRET
        generateValue: true # random 256-bit key created by Render; keep it, never regenerate it
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard (TLS is enforced)
      - key: APP_NAME
        value: "الخزنة"
      - key: TOTP_ISSUER
        value: "Team Vault"
